<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django tutorial</title>
    <style>
        table,th,td {
            border: 1px solid rgb(8, 8, 8);
        }
    </style>
</head>
<body>
    
    <h1>Welcome to Django tutorial</h1> 
    <h2>This is a simple Django project</h2>
    
  
    

    <table class="container">
  <tr>
    <th>S.No</th>
    <th>Name</th>
    <th>Age</th>
    <th>Can Vote</th>
  </tr>

  {% for people in peoples %}

  <tr>
    <td>{{forloop.counter}}</td>
    <td>{{people.name}}</td>
    <td>{{people.age}}</td>
    <td {% if people.age < 18 %}style="background-color: red"{% else %}style="background-color: green"{% endif %}>
        {% if people.age >= 18 %}
            👍
        {% else %}
            👎
        {% endif %}

  </tr>
  
  {% endfor %}
</table>


    
      <p>{{text|truncatewords:80}}</p>    

    <script>
        console.log("Hello Django");
    </script>
</body>
</html>
