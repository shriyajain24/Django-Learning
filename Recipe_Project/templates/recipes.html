{% extends "base.html" %}
{% block start %}
    
    
<div class="container">
    <div class="row">
        <div class="col-md-12">
            <h1>Recipes</h1>
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>Recipe Name</th>
                        <th>Recipe Description</th>
                        <th>Recipe Image</th>
                    </tr>
                </thead>
                <tbody>
                    {% for recipe in recipes %}
                    <tr>
                        <td>{{ recipe.recipe_name }}</td>
                        <td>{{ recipe.recipe_description }}</td>
                        <td><img src="{{ recipe.recipe_image.url }}" alt="{{ recipe.recipe_name }}" width="100"></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

{% endblock %}
