{% extends "base.html" %}
{% block start %}
    
    
<div class="container" mt-5>
    <form class="col-6 mx-auto card p-3 shadow-lg" method="POST" enctype="multipart/form-data">
        
        {% csrf_token %}
        <h2>Add Recipe</h2>
        <hr>
        <div class="mb-3">
            <label for="recipe_name" class="form-label">Recipe Name</label>
            <input name="recipe_name" required type="text" class="form-control" >
        </div>
        <div class="mb-3">
            <label for="description" 
             class="form-label">Recipe Description</label>
            <textarea name="recipe_description" class="form-control" required ></textarea>
        </div>
        <div class="mb-3">
            <label for="image"  class="form-label">Recipe Image</label>
            <input name="recipe_image" type="file" class="form-control" >
        </div>
        <button type="submit" class="btn btn-success">Add Recipe</button>
    </form>
  

    <table class="table">
        <thead>
            <tr>
                <th scope="col">#</th>
                <th scope="col">Recipe Name</th>
                <th scope="col">Recipe Description</th>
                <th scope="col">Recipe Image</th>
                <th scope="col">Actions</th>

            </tr>
        </thead>
        <tbody>
            {% for recipe in recipes %}
            <tr>
                <th scope="row">{{ forloop.counter }}</th>
                <td>{{recipe.recipe_name}}</td>
                <td>{{recipe.recipe_description}}</td>
                <td>
                    <img src="/media/{{recipe.recipe_image}}" style="height: 100px">
                </td>
                <td>
                    <a href="/delete_recipe/{{recipe.id}}/" class="btn btn-danger m-2">Delete</a>
                    <a href="/update_recipe/{{recipe.id}}/" class="btn btn-success m-2">Update</a>
                </td>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>




</div>

{% endblock %}
